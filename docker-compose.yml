services:
  postgres:
    image: postgres:17-alpine
    container_name: dos-freightflow-postgres
    environment:
      POSTGRES_DB: dosfreightflow
      POSTGRES_USER: dos
      POSTGRES_PASSWORD: dos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dos", "-d", "dosfreightflow"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: deploy/images/Dockerfile.api
    container_name: dos-freightflow-api
    environment:
      APP_ENV: development
      HTTP_ADDR: "0.0.0.0:8080"
      DATABASE_URL: "postgres://dos:dos@postgres:5432/dosfreightflow?sslmode=disable"
      SESSION_SECRET: "dev-session-secret-32-bytes-minimum-length"
      OTP_SECRET: "dev-otp-secret-32-bytes-minimum-length-here"
      APP_DEV_CODE_VISIBLE: "true"
      LOG_LEVEL: debug
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: deploy/images/Dockerfile.web
    container_name: dos-freightflow-web
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata: